data:
  processed_dir: data/processed
  splits_dir: data/splits
  resolution: 512
  tile_size: 512

model:
  name: res_unet
  base_channels: 48

experiment:
  name: res-unet

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  cldice_weight: 0.3
  focal_gamma: 2.0
  boundary_weight: 0.0

training:
  max_epochs: 50
  patience: null
  batch_size: 4
  workers: 0
  learning_rate: 0.0003
  seed: 42
  device: tpu
  output_dir: runs

evaluation:
  postprocessing: connected_components
  thresholds: [0.3, 0.4, 0.5, 0.6, 0.7]
  min_instance_size: 4
  watershed_min_distance: 5
